#VRML_SIM R2023b utf8

EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2023b/projects/objects/floors/protos/RectangleArena.proto"
EXTERNPROTO "https://raw.githubusercontent.com/cyberbotics/webots/R2023b/projects/appearances/protos/Parquetry.proto"

PROTO RoombaRobot [
  field SFVec3f    translation     0 0 0
  field SFRotation rotation        0 0 1 0
  field SFString   name            "RoombaRobot"
  field SFColor    color           0.7 0.7 0.7
  field SFString   controller      "my_controller"
  field MFString   controllerArgs  []
  field SFString   customData      ""
  field SFBool     supervisor      FALSE
  field SFBool     synchronization TRUE
  field MFNode     extensionSlot   []
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    customData IS customData
    supervisor IS supervisor
    synchronization IS synchronization
    
    children [
      # Main body (puck shape)
      DEF BODY Shape {
        appearance PBRAppearance {
          baseColor IS color
          metalness 0.3
          roughness 0.7
        }
        geometry Cylinder {
          height 0.09
          radius 0.17
          subdivision 24
        }
      }
      
      # Left wheel (positioned on left side of robot)
      DEF LEFT_WHEEL HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0 0.15 -0.03
        }
        device [
          RotationalMotor {
            name "left_wheel_motor"
            maxVelocity 10
            maxTorque 10
          }
          PositionSensor {
            name "left_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation 0 0.15 -0.03
          rotation 1 0 0 1.5708
          children [
            DEF LEFT_WHEEL_SHAPE Shape {
              appearance PBRAppearance {
                baseColor 0.2 0.2 0.2
                metalness 0.7
                roughness 0.3
              }
              geometry Cylinder {
                height 0.03
                radius 0.04
                subdivision 16
              }
            }
          ]
          boundingObject USE LEFT_WHEEL_SHAPE
          physics Physics {
            density -1
            mass 0.08
          }
        }
      }
      
      # Right wheel (positioned on right side of robot)
      DEF RIGHT_WHEEL HingeJoint {
        jointParameters HingeJointParameters {
          axis 0 1 0
          anchor 0 -0.15 -0.03
        }
        device [
          RotationalMotor {
            name "right_wheel_motor"
            maxVelocity 10
            maxTorque 10
          }
          PositionSensor {
            name "right_wheel_sensor"
          }
        ]
        endPoint Solid {
          translation 0 -0.15 -0.03
          rotation 1 0 0 1.5708
          children [
            DEF RIGHT_WHEEL_SHAPE Shape {
              appearance PBRAppearance {
                baseColor 0.2 0.2 0.2
                metalness 0.7
                roughness 0.3
              }
              geometry Cylinder {
                height 0.03
                radius 0.04
                subdivision 16
              }
            }
          ]
          boundingObject USE RIGHT_WHEEL_SHAPE
          physics Physics {
            density -1
            mass 0.08
          }
        }
      }
      
      # Front caster wheel (support wheel, no motor control needed)
      DEF CASTER_WHEEL Solid {
        # positioned to create stable 3-point contact with main wheels
        translation 0.13 0 -0.05
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.4 0.4 0.4
              metalness 0.6
              roughness 0.4
            }
            geometry Sphere {
              # smaller caster for realistic proportions
              radius 0.02
              subdivision 12
            }
          }
        ]
        boundingObject Sphere {
          radius 0.02
        }
        physics Physics {
          density -1
          # increased mass to help balance front/rear weight distribution
          mass 0.08
        }
      }
      
      # Proximity sensors array (8 sensors arranged according to iRobot Roomba specification)
      
      # ps0 - 45° right (front-right diagonal)
      DEF PS0 DistanceSensor {
        translation 0.12 -0.12 0.05
        rotation 0 0 1 -0.785398
        children [
          DEF SENSOR_SHAPE Shape {
            appearance PBRAppearance {
              baseColor 0.1 0.1 0.1
              metalness 0.1
              roughness 0.9
            }
            geometry Box {
              size 0.008 0.008 0.008
            }
          }
        ]
        name "ps0"
        lookupTable [
          0 0 0
          0.8 0.8 0
        ]
        type "infra-red"
      }
      
      # ps1 - 20° right (front-right shoulder)
      DEF PS1 DistanceSensor {
        translation 0.15 -0.055 0.05
        rotation 0 0 1 -0.349066
        children [
          USE SENSOR_SHAPE
        ]
        name "ps1"
        lookupTable [
          0 0 0
          0.8 0.8 0
        ]
        type "infra-red"
      }
      
      # ps2 - 0° (straight front - main collision avoidance)
      DEF PS2 DistanceSensor {
        translation 0.16 0 0.05
        rotation 0 0 1 0
        children [
          USE SENSOR_SHAPE
        ]
        name "ps2"
        lookupTable [
          0 0 0
          0.8 0.8 0
        ]
        type "infra-red"
      }
      
      # ps3 - -20° left (front-left shoulder)
      DEF PS3 DistanceSensor {
        translation 0.15 0.055 0.05
        rotation 0 0 1 0.349066
        children [
          USE SENSOR_SHAPE
        ]
        name "ps3"
        lookupTable [
          0 0 0
          0.8 0.8 0
        ]
        type "infra-red"
      }
      
      # ps4 - -45° left (front-left diagonal)
      DEF PS4 DistanceSensor {
        translation 0.12 0.12 0.05
        rotation 0 0 1 0.785398
        children [
          USE SENSOR_SHAPE
        ]
        name "ps4"
        lookupTable [
          0 0 0
          0.8 0.8 0
        ]
        type "infra-red"
      }
      
      # ps5 - -90° left side (wall following - left)
      DEF PS5 DistanceSensor {
        translation 0 0.16 0.05
        rotation 0 0 1 1.5708
        children [
          USE SENSOR_SHAPE
        ]
        name "ps5"
        lookupTable [
          0 0 0
          0.8 0.8 0
        ]
        type "infra-red"
      }
      
      # ps6 - -135° left-rear diagonal
      DEF PS6 DistanceSensor {
        translation -0.12 0.12 0.05
        rotation 0 0 1 2.356194
        children [
          USE SENSOR_SHAPE
        ]
        name "ps6"
        lookupTable [
          0 0 0
          0.8 0.8 0
        ]
        type "infra-red"
      }
      
      # ps7 - 90° right side (wall following - right)
      DEF PS7 DistanceSensor {
        translation 0 -0.16 0.05
        rotation 0 0 1 -1.5708
        children [
          USE SENSOR_SHAPE
        ]
        name "ps7"
        lookupTable [
          0 0 0
          0.8 0.8 0
        ]
        type "infra-red"
      }
      
      # Front touch sensor (bump detection)
      DEF TOUCH_FRONT TouchSensor {
        translation 0.165 0 0.04
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 1 0 0
              metalness 0.1
              roughness 0.9
              transparency 0.5
            }
            geometry Box {
              size 0.02 0.3 0.02
            }
          }
        ]
        name "touch_front"
        boundingObject Box {
          size 0.02 0.3 0.02
        }
        physics Physics {
          density -1
          mass 0.01
        }
      }
      
      # Inertial Measurement Unit (IMU) - combines compass and gyro functionality
      InertialUnit {
        name "imu"
        translation 0 0 0.08
      }
      
      # Lidar Sensor for SLAM and Mapping
      Lidar {
        # מיקום: מרכז הרובוט (x=0, y=0), מוגבה מעט מעל הגוף הראשי
        translation 0 0 0.09
        rotation 0 0 1 0  # כיוון התחלתי קדימה
        children [
          # Lidar visual housing/tower
          Shape {
            appearance PBRAppearance {
              baseColor 0.2 0.2 0.2
              metalness 0.8
              roughness 0.2
            }
            geometry Cylinder {
              height 0.03
              radius 0.025
              subdivision 16
            }
          }
        ]
        name "lidar"  # שם ייחודי לגישה מהבקר
        numberOfLayers 1  # סריקה דו-ממדית (שכבה אחת), מתאים לרובוט ניקיון
        horizontalResolution 360  # 360 נקודות מדידה בסיבוב שלם (מדידה כל מעלה)
        minRange 0.12  # טווח מינימלי (חיישנים לא רואים קרוב מדי)
        maxRange 3.5  # טווח מקסימלי (3.5 מטר, מספיק לדירה)
        noise 0.01  # הוספת רעש קטן למדידה לסימולציה מציאותית יותר
        resolution -1  # מאפשר ל-Webots לחשב את הרזולוציה הזוויתית האופטימלית
      }
      
      # Extension slot for additional sensors
      Group {
        children IS extensionSlot
      }
    ]
    
    boundingObject USE BODY
    physics Physics {
      density -1
      mass 2.0
      # shift center of mass slightly forward to balance the robot
      centerOfMass [0.02 0 0]
      inertiaMatrix [
        0.02 0.02 0.04
        0 0 0
      ]
    }
  }
}